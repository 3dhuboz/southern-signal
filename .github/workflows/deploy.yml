name: Deploy to Cloudflare Pages

# Runs on every push to master (→ production), push to dev (→ dev preview
# alias), every same-repo PR targeting master/dev (→ per-PR preview alias),
# plus manual dispatch. The Cloudflare Pages project (`southern-signal`) is
# NOT linked to this repo via the dashboard's Git provider integration —
# this workflow IS the deploy pipeline. If you disable it, deploys won't
# happen automatically.
#
# The wrangler `--branch` flag determines which Cloudflare Pages alias the
# build lands on:
#   master push       -> production / https://southern-signal.pages.dev
#   dev               → https://dev.southern-signal.pages.dev (preview alias)
#   PR (same-repo)    → https://<head-ref>.southern-signal.pages.dev
#                       e.g. claude/phase-a2-vu-... →
#                       https://claude-phase-a2-vu-spiritbox-ovilus.southern-signal.pages.dev
#
# Per-PR aliases let reviewers eyeball a PR's visual changes without
# merging first. They also avoid the race where two PRs targeting dev
# would clobber each other if both deployed to the dev alias.
#
# Fork PRs deliberately don't deploy: GitHub doesn't expose secrets to
# fork PRs, so wrangler-action would fail without CLOUDFLARE_API_TOKEN
# anyway. The explicit head.repo == repository guard makes that intent
# unambiguous and keeps fork-CI logs free of confusing "missing token"
# errors.
#
# Package manager: pnpm. The repo has `pnpm-lock.yaml` as the source of
# truth (see pwa/package.json `packageManager`). Using `npm ci` against a
# pnpm-resolved tree silently downloads slightly different versions and
# breaks `--frozen-lockfile` semantics — the 12-specialist panel flagged
# this as a P0 CI smell on 2026-05-19.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

# Cancel any in-flight deploy if a newer push lands — no point shipping an
# already-stale commit when a fresher one is queued behind it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `deployments: write` lets the workflow create a deployment status that
      # shows up on the commit + PR — useful for spotting deploy failures
      # without leaving GitHub.
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm/action-setup MUST run before actions/setup-node — setup-node's
      # `cache: pnpm` looks up the pnpm binary while configuring the cache,
      # so swapping the order produces "pnpm: command not found".
      # `package_json_file` MUST point at pwa/package.json — the action defaults
      # to the repo root, where `packageManager` is not declared. Without this
      # the runner errors `No pnpm version is specified.` and the deploy aborts
      # in 11s before pnpm install even runs.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
          package_json_file: pwa/package.json

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pwa/pnpm-lock.yaml

      # `--ignore-workspace` is intentional. The repo has a pnpm-workspace.yaml
      # at root (added in Phase C to stop pnpm 10.x on Windows from walking up
      # the directory tree and finding an unrelated workspace file in the
      # user's home dir — see PR #8 / commit f69942a). Linux CI doesn't have
      # the home-dir-collision problem, but it DOES need the install to use
      # pwa/pnpm-lock.yaml rather than a root-level lockfile (which isn't
      # committed). Passing --ignore-workspace tells pnpm to treat pwa as a
      # standalone package, just like the dev workflow before the workspace
      # file existed.
      - name: Install dependencies
        working-directory: pwa
        run: pnpm install --frozen-lockfile --ignore-workspace

      # Lint is now a hard gate on every trigger — including push to dev /
      # master. The earlier `continue-on-error: push` carve-out existed
      # while a parallel sweep was burning down warnings; with the tree
      # lint-clean and the suite stable, letting dev pushes ship through
      # a regression silently is the worse failure mode. PRs already block
      # — making push block too means the dev preview alias can never
      # publish a build that wouldn't have merged.
      - name: Lint
        working-directory: pwa
        run: pnpm lint

      - name: Type-check + build
        working-directory: pwa
        run: pnpm build

      # Bundle-size budget gate. Reads pwa/dist after the build step and
      # fails the workflow if the main index-*.js chunk crosses the gzipped
      # budget (75 KB) or if the lazy SDK chunk has been re-bundled into
      # the main entry. Budget rationale + implementation details live in
      # pwa/scripts/check-bundle-size.mjs. No continue-on-error — blocking
      # on bust is the whole point.
      - name: Check bundle size budget
        working-directory: pwa
        run: pnpm check:bundle

      - name: Run tests
        working-directory: pwa
        run: pnpm test
        # Same rationale as lint above: blocking on push means a single
        # regression slipping in through a direct dev push can't deploy
        # to https://dev.southern-signal.pages.dev with a broken build.
        # If a genuine flake appears, fix the flake — don't paper over it
        # by letting deploys ride through red CI.

      # Wipe the preview D1 before deploying to the dev preview alias so
      # one preview's seeded data isn't visible to the next. The schema is
      # idempotent (CREATE TABLE IF NOT EXISTS in ensureCommunitySchema) so
      # dropping the tables here is sufficient — the next request recreates
      # them. Production D1 is never touched because the conditional pins
      # this step to the dev branch.
      #
      # Set the PREVIEW_D1_NAME repo variable in Settings → Variables once
      # the preview DB exists (default matches wrangler.jsonc above). If
      # the secret or variable is missing the step still runs but the
      # `continue-on-error` below means a wrangler failure won't block the
      # deploy — the schema simply self-heals on first request with
      # whatever data is already in the DB.
      - name: Reset preview D1
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: d1 execute ${{ vars.PREVIEW_D1_NAME || 'southern-signal-community-preview' }} --remote --file=scripts/reset-preview-d1.sql
          workingDirectory: pwa

      # Deploy runs on:
      #   - push to master / dev → production / dev alias (as before)
      #   - same-repo PR         → per-PR preview alias derived from head_ref
      # Fork PRs are explicitly excluded by the head.repo == repository
      # guard. GitHub doesn't expose CLOUDFLARE_API_TOKEN to fork PRs
      # anyway, so wrangler-action would fail without this guard — the
      # explicit check just makes the intent visible and keeps fork CI
      # logs clean.
      #
      # The previous "race the dev-branch preview alias" concern from the
      # old gate is now solved by the --branch flag: PRs use head_ref
      # (per-PR alias), pushes use ref_name (master/dev alias). Two PRs
      # targeting dev land on different aliases and can't clobber each
      # other. Concurrency group is also per-ref (push→refs/heads/dev,
      # PR→refs/pull/N/merge) so they don't cancel each other either.
      - name: Deploy to Cloudflare Pages
        if: |
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action cd's into workingDirectory BEFORE running command,
          # so the deploy path is relative to pwa/. `dist` here resolves to
          # pwa/dist — running from repo root with `pwa/dist` would also
          # work, but pinning workingDirectory lets wrangler auto-discover
          # pwa/wrangler.jsonc for the project's resource bindings.
          #
          # `--branch=` picks the Cloudflare Pages alias:
          #   master push: github.ref_name (master) -> production
          #   dev push:    github.ref_name (dev) -> dev alias
          #   PR event:    github.head_ref (PR source branch) -> per-PR alias
          # github.head_ref is empty on push events, so pushes use their real
          # branch name. Do not map master to main: this Pages project treats
          # main as Preview, leaving southern-signal.pages.dev stale.
          #
          # `--commit-dirty=true` silences the warning about untracked dist/
          # files (dist is gitignored, so the runner always sees them as new).
          packageManager: pnpm
          wranglerVersion: "4.78.0"
          command: pages deploy dist --project-name=southern-signal --branch=${{ github.head_ref || github.ref_name }} --commit-dirty=true
          workingDirectory: pwa
