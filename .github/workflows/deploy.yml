name: Deploy to Cloudflare Pages

# Runs on every push to master + on manual dispatch. The Cloudflare Pages
# project (`southern-signal`) is NOT linked to this repo via the dashboard's
# Git provider integration — this workflow IS the deploy pipeline. If you
# disable it, deploys won't happen automatically.

on:
  push:
    branches: [master]
  workflow_dispatch:

# Cancel any in-flight deploy if a newer push lands — no point shipping an
# already-stale commit when a fresher one is queued behind it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # `deployments: write` lets the workflow create a deployment status that
      # shows up on the commit + PR — useful for spotting deploy failures
      # without leaving GitHub.
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: pwa/package-lock.json

      - name: Install dependencies
        working-directory: pwa
        run: npm ci

      - name: Type-check + build
        working-directory: pwa
        run: npm run build

      - name: Run tests
        working-directory: pwa
        run: npm test -- --run

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler-action cd's into workingDirectory BEFORE running command,
          # so the deploy path is relative to pwa/. `dist` here resolves to
          # pwa/dist — running from repo root with `pwa/dist` would also
          # work, but pinning workingDirectory lets wrangler auto-discover
          # pwa/wrangler.jsonc for the project's resource bindings.
          # `--branch=master` puts this on the production alias.
          # `--commit-dirty=true` silences the warning about untracked dist/
          # files (dist is gitignored, so the runner always sees them as new).
          command: pages deploy dist --project-name=southern-signal --branch=master --commit-dirty=true
          workingDirectory: pwa
