<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="YEP The Boys">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <linearGradient id="ink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fdfdfd"/>
      <stop offset="100%" stop-color="#dcdcdc"/>
    </linearGradient>
    <linearGradient id="cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#c40e0e"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="36" fill="url(#bg)"/>
  <!-- 2x2 grid: B X / Y S -->
  <g font-family="Impact, 'Arial Black', sans-serif" font-weight="900" fill="url(#ink)" font-size="100" text-anchor="middle" dominant-baseline="central">
    <text x="78" y="86">B</text>
    <text x="78" y="178">Y</text>
    <text x="180" y="178">S</text>
  </g>
  <!-- Red X tile (top-right slot) -->
  <g transform="translate(140 38)">
    <rect width="80" height="80" rx="10" fill="#0a0a0a" stroke="#1c1c1c" stroke-width="2"/>
    <g stroke="url(#cross)" stroke-width="14" stroke-linecap="round">
      <line x1="20" y1="20" x2="60" y2="60"/>
      <line x1="60" y1="20" x2="20" y2="60"/>
    </g>
  </g>
</svg>
