<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Maskable PWA icon — full-bleed solid bg, mark constrained to the inner
       80% safe zone (W3C maskable spec). Solid bg #07090C, mark in #5DF2C7. -->
  <rect width="512" height="512" fill="#07090C"/>
  <!-- Mark inside the 80% safe zone: 410x410 centered at (51, 51).
       Scale = 410/64 ≈ 6.40625. -->
  <g transform="translate(51 51) scale(6.40625)">
    <!-- Posterior arc -->
    <circle cx="32" cy="32" r="26" fill="none" stroke="#5DF2C7" stroke-width="1.2" opacity="0.18" />
    <path
      d="M 13.64 50.36 A 26 26 0 1 1 50.36 50.36"
      fill="none"
      stroke="#5DF2C7"
      stroke-width="2.4"
      stroke-linecap="round"
      opacity="0.85"
    />
    <!-- Constellation guide lines -->
    <g stroke="#5DF2C7" stroke-width="0.6" fill="none" opacity="0.35" stroke-linecap="round">
      <line x1="32" y1="18" x2="32" y2="46" />
      <line x1="20" y1="30" x2="44" y2="30" />
    </g>
    <!-- Southern Cross stars -->
    <circle cx="32" cy="18" r="2.2" fill="#5DF2C7" />
    <circle cx="20" cy="30" r="2.0" fill="#5DF2C7" />
    <circle cx="44" cy="30" r="1.8" fill="#5DF2C7" />
    <circle cx="38" cy="38" r="1.2" fill="#5DF2C7" opacity="0.75" />
    <!-- Acrux — alpha / signal node -->
    <circle cx="32" cy="46" r="5.2" fill="#5DF2C7" opacity="0.18" />
    <circle cx="32" cy="46" r="3.2" fill="#5DF2C7" />
  </g>
</svg>
